# Main settings. Env overrides: RAINPP_MODE, RAINPP_DATA_DIR, RAINPP_MODEL_DIR.

mode: demo            # demo | real

paths:
  data_dir: data
  model_dir: models

domain:               # IMD 0.25 deg gridded rainfall extent (verified, see DATA_SOURCES.md)
  lat_min: 6.5
  lat_max: 38.5
  lon_min: 66.5
  lon_max: 100.0
  resolution_deg: 0.25

season:
  months: [6, 7, 8, 9]  # JJAS monsoon

forecast:
  source: gefs_reforecast
  init_hour_utc: 0
  lead_days: [1, 2, 3]
  members: [c00]        # control only for the screening prototype
  # IMD rain day = 24 h ending 03 UTC, labelled by its END date (verified empirically, Phase 3).
  # Lead N from a 00 UTC run = forecast hours (24N-21, 24N+3], valid_date = init_date + N.
  rain_day_end_hour_utc: 3

observation:
  source: imd_gridded

split:                  # chronological, inclusive years
  train: [2000, 2015]   # 16 seasons (extended from 2010-2015 once the 2000s reforecast was downloaded)
  validation: [2016, 2017]
  test: [2018, 2019]
  # NOAA GEFSv12 *operational* forecasts (live-mode inputs) with IMD observations; never used for training or
  # tuning, scored once with the frozen models alongside the test years.
  operational_test: [2021, 2025]

api:
  host: 127.0.0.1
  port: 8000
  cors_origins: ["http://localhost:5173"]
