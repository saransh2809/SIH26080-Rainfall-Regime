# Case studies offered in the dashboard. Chosen from the observations, not from memory: in each period, days with
# the most IMD 0.25° cells at or above 115.6 mm, one per region. `init` is the 00 UTC run whose day-1 forecast is
# valid for the event day; products exist for the three runs before it, so all three lead days show the event.
# `district` is the district (Census-2011 boundaries) containing the heaviest observed cell; `observed_max_mm` is
# that cell's IMD value. Held-out events (test / operational) are built only after the one-time final evaluation.

events:
