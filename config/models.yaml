# Model settings. Hyperparameters are chosen on the VALIDATION years only.

features:                 # forecast-time features shared by the ML correctors
  - nwp_precip_mm
  - nwp_log1p
  - nwp_mean_3x3
  - nwp_max_3x3
  - nwp_mean_7x7
  - nwp_max_7x7
  - obs_climatology_mm    # fitted on training years only
  - doy_sin
  - doy_cos
  - lat
  - lon
  - lead_day

global_lgbm:
  # Tweedie loss models rainfall's point mass at zero plus skewed positive amounts.
  params:
    objective: tweedie
    tweedie_variance_power: 1.5
    learning_rate: 0.05
    num_leaves: 63
    min_data_in_leaf: 500
    feature_fraction: 0.9
    bagging_fraction: 0.8
    bagging_freq: 1
    lambda_l2: 1.0
    verbose: -1
    seed: 42
  num_boost_round: 2000
  early_stopping_rounds: 50

evaluation:
  fss_threshold_mm: [15.6, 64.5]
  fss_window_cells: [1, 5, 9, 17]   # 0.25°, 1.25°, 2.25°, 4.25°
