# Model settings. Hyperparameters are chosen on the VALIDATION years only.

features:                 # forecast-time features shared by the ML correctors
  - nwp_precip_mm
  - nwp_log1p
  - nwp_mean_3x3
  - nwp_max_3x3
  - nwp_mean_7x7
  - nwp_max_7x7
  - obs_climatology_mm    # fitted on training years only
  - doy_sin
  - doy_cos
  - lat
  - lon
  - lead_day

global_lgbm:
  # Tweedie loss models rainfall's point mass at zero plus skewed positive amounts.
  params:
    objective: tweedie
    tweedie_variance_power: 1.5
    learning_rate: 0.05
    num_leaves: 63
    min_data_in_leaf: 500
    feature_fraction: 0.9
    bagging_fraction: 0.8
    bagging_freq: 1
    lambda_l2: 1.0
    verbose: -1
    seed: 42
  num_boost_round: 2000
  early_stopping_rounds: 50

regime_classifier:
  features:               # all known at forecast time (see src/rainpp/regimes/features.py)
    - fc_core_rain_mm
    - fc_core_anom
    - fc_west_coast_rain_mm
    - llj_u850
    - central_u850
    - trough_vort_max
    - trough_vort_mean
    - trough_mslp_min
    - mslp_south_minus_trough
    - core_pwat_mm
    - obs_core_anom_lag1
    - obs_core_anom_lag2
    - lead_day
    - doy_sin
    - doy_cos
  lgbm_params:
    learning_rate: 0.03
    num_leaves: 15
    min_data_in_leaf: 20
    feature_fraction: 0.8
    lambda_l2: 1.0
    verbose: -1
    seed: 42
  max_boost_round: 1000
  early_stopping_rounds: 50
  cnn_scalar_features:    # joined to the CNN's pooled map features (maps: u850, v850, vort850, MSLP, PWAT)
    - fc_core_rain_mm
    - fc_core_anom
    - fc_west_coast_rain_mm
    - obs_core_anom_lag1
    - obs_core_anom_lag2
    - lead_day
    - doy_sin
    - doy_cos

regime_correction:
  classifier: LGBM          # Phase 5 classifier that supplies regime probabilities (RF or LGBM)
  static_features: [elevation_m, coast_km]
  c2_min_rows: 200000       # regimes with fewer training rows use the pooled model
  bootstrap: {block_days: 5, n_boot: 200}

heavy_rain:
  # Isotonic calibration (fitted on out-of-fold training predictions), chosen on validation 2016-2017:
  #   heavy: already reliable; calibration leaves Brier unchanged (n.s.) and lowers AUC 0.858 -> 0.848
  #   very_heavy: raw model over-confident (0.43 -> 0.19 observed); calibration improves Brier
  #               significantly (BSS 0.013 -> 0.023) at the cost of AUC 0.873 -> 0.782
  calibrate: {heavy: false, very_heavy: true}

evaluation:
  fss_threshold_mm: [15.6, 64.5]
  fss_window_cells: [1, 5, 9, 17]   # 0.25°, 1.25°, 2.25°, 4.25°
