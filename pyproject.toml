[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rainpp"
version = "0.1.0"
description = "Regime-aware AI post-processing of monsoon rainfall forecasts (SIH 26080)"
requires-python = ">=3.11,<3.14"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "xarray>=2024.1",
    "netCDF4>=1.6",
    "scipy>=1.11",
    "pyyaml>=6.0",
    "pyarrow>=15.0",
    "pydantic>=2.5",
]

[project.optional-dependencies]
grib = ["cfgrib>=0.9.10", "eccodes>=1.7", "s3fs>=2024.2"]
geo = ["geopandas>=0.14", "shapely>=2.0", "xagg>=0.3"]
ml = ["scikit-learn>=1.4", "lightgbm>=4.2", "joblib>=1.3"]
api = ["fastapi>=0.110", "uvicorn>=0.27"]
dl = ["torch>=2.2"]
dev = ["pytest>=8.0", "httpx>=0.27", "ruff>=0.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
